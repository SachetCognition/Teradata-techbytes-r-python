name: Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scikit-learn matplotlib
        pip install pytest pytest-cov

    - name: Unzip Transactions.csv
      run: |
        cd R_Py-Input_Tables
        if [ -f Transactions.csv.zip ] && [ ! -f Transactions.csv ]; then
          unzip Transactions.csv.zip
        fi

    - name: Run tests with coverage
      run: |
        pytest tests/ --cov=. --cov-report=html --cov-report=term-missing -v

    - name: Upload coverage report
      if: matrix.python-version == '3.9'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: htmlcov/

  r-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up R
      uses: r-lib/actions/setup-r@v2

    - name: Install R dependencies
      run: |
        Rscript -e 'install.packages(c("testthat", "randomForest"), repos="https://cloud.r-project.org")'

    - name: Run R tests
      run: |
        Rscript -e 'testthat::test_file("tests/r/test_part2.R")'
        Rscript -e 'testthat::test_file("tests/r/test_part4.R")'
